name: vika-collector
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node poll.mjs
        env:
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
      - run: |
          git config user.name "vika-collector"
          git config user.email "vika@local"
          git add queue.json seen.json
          git diff --cached --quiet && echo "no changes" || git commit -m "queue update"
          git push
